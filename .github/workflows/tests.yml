name: Tests

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 5 * * 1" # weekly: catch breaking changes in new HA releases
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (HA ${{ matrix.ha }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported release (hacs.json "homeassistant")
          - ha: "2025.1"
            python: "3.13"
            phcc: "pytest-homeassistant-custom-component==0.13.205"
          # Latest release
          - ha: latest
            python: "3.14"
            phcc: "pytest-homeassistant-custom-component"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "${{ matrix.phcc }}"
          python -c "from homeassistant.const import __version__; print('Home Assistant', __version__)"
      - name: Run tests
        run: python -m pytest -v
