name: Validate

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # LICENSE is scoped to this fork's changes (upstream code is unlicensed, see
          # marlub/philips-airpurifier#2). Drop "license" once the whole project is MIT.
          ignore: brands license
